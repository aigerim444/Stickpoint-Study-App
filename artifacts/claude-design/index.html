  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #FBE8D3; font-family: 'Nunito', sans-serif; }
    ::selection { background: #FFC93C; color: #201E2E; }
    @keyframes pipBounce { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
    @keyframes pipTilt { 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }
    @keyframes pipCelebrate { 0%{ transform:translateY(0) rotate(0deg); } 30%{ transform:translateY(-18px) rotate(-8deg); } 60%{ transform:translateY(0) rotate(8deg); } 100%{ transform:translateY(0) rotate(0deg); } }
    @keyframes popIn { 0%{ transform:scale(.7); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
    @keyframes fadeUp { 0%{ transform:translateY(14px); opacity:0; } 100%{ transform:translateY(0); opacity:1; } }
    @keyframes shimmerBar { 0%{ background-position:0 0; } 100%{ background-position:40px 0; } }
    @keyframes confettiFall { 0%{ transform:translateY(-10px) rotate(0deg); opacity:1;} 100%{ transform:translateY(140px) rotate(360deg); opacity:0;} }
    @keyframes spin { 0%{ transform:rotate(0deg); } 100%{ transform:rotate(360deg); } }
  </style>

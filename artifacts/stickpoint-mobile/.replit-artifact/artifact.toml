kind = "mobile"
previewPath = "/mobile/"
title = "Stickpoint Mobile"
version = "1.0.0"
id = "artifacts/stickpoint-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24376

[services.development]
run = "pnpm --filter @workspace/stickpoint-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stickpoint-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/stickpoint-mobile", "run", "serve" ]

[services.env]
PORT = "24376"
BASE_PATH = "/mobile/"
